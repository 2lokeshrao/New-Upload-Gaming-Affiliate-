<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" fill="none">
  <!-- Bar Chart Base (Purple to Pink) -->
  <path d="M40 100 Q40 105 45 105 L150 105 Q155 105 155 100 L155 90 C130 90 100 80 80 60 C60 80 50 90 40 90 Z" fill="#4338ca"/>
  
  <rect x="45" y="65" width="20" height="35" rx="2" fill="#5b21b6"/>
  <rect x="70" y="45" width="20" height="55" rx="2" fill="#7c3aed"/>
  <rect x="95" y="25" width="20" height="75" rx="2" fill="#d946ef"/>
  
  <!-- Upward Arrow (Pink to Purple) -->
  <path d="M120 70 L160 30 L160 70 Z" fill="#db2777"/>
  <path d="M40 85 C60 80 80 60 140 30 L120 70 C80 90 60 100 40 105 Z" fill="#6d28d9"/>
  
  <!-- Checkmark (Yellow) -->
  <path d="M75 75 L95 95 L145 50" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- % and Star -->
  <text x="35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f59e0b">%</text>
  <path d="M110 15 L113 22 L120 25 L113 28 L110 35 L107 28 L100 25 L107 22 Z" fill="#f59e0b"/>
  
  <!-- Text -->
  <text x="175" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#f8fafc">Bonus</text>
  <text x="175" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#cbd5e1">Promo Code</text>
  <text x="430" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#64748b">®</text>
</svg>
